// core: the protocol relay (M1), the input-injection guard (M2) and the ticket executor (M3).
// Pure JVM. No Minecraft, no Forge, no networking: the whole point is that the rules can be
// executed and asserted in a unit test.
//
// Two variants, ONE source tree:
//   ./gradlew :core:jar                 -> guarded   (default; this is what releases ship)
//   ./gradlew :core:jar -Punguarded     -> unguarded (self-compiled only; bypasses the policy)
// The variant is stamped into the jar manifest as `Modtest-Guard-Variant`, printed by
// BuildInfo.describe(), and re-read at runtime by Guard.BuildVariant.current().
def guardVariant = project.hasProperty('unguarded') ? 'unguarded' : 'guarded'

// The Gson that Minecraft 1.20.1 actually ships (verified on a real launch classpath: gson-2.10.jar).
// Compiling against anything newer lets an API reach the jar that the runtime does not have.
def runtimeGsonVersion = '2.10'

dependencies {
    implementation "com.google.code.gson:gson:${runtimeGsonVersion}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    archiveBaseName = 'modtest-harness-core'
    manifest {
        attributes(
                'Implementation-Title': 'modtest-mcp harness core (DEV ONLY)',
                'Implementation-Version': project.version,
                'Modtest-Artifact': 'harness',
                'Modtest-Guard-Variant': guardVariant,
                'Modtest-Warning': guardVariant == 'guarded'
                        ? 'Development harness. Guarded build: refuses undeclared hosts. Never bundle into a product jar.'
                        : 'UNGUARDED DEVELOPMENT HARNESS BUILD: the injection policy is disabled. Use only on servers you own. Never redistribute.'
        )
    }
}

tasks.register('printGuardVariant') {
    group = 'verification'
    description = 'Prints which guard variant this build produces'
    doLast {
        println "GUARD-VARIANT=" + guardVariant
    }
}

// ---- guardrail: core must not use Gson APIs that the game does not ship ----------------------
// A real client crashed with `NoSuchMethodError: JsonObject.isEmpty()` because core compiled against
// Gson 2.10.1 while Minecraft 1.20.1 ships Gson 2.10. Unit tests compiled against the same newer
// Gson stay green forever, so the build has to check this instead: (1) the compile classpath must be
// the runtime version, and (2) every Gson member reference in core's bytecode must exist there.
tasks.register('verifyGsonApiSurface') {
    group = 'verification'
    description = 'Asserts core compiles against the Gson Minecraft ships and references no newer API'
    dependsOn 'compileJava'
    outputs.upToDateWhen { false }
    doLast {
        // The expected runtime version is overridable so the check itself can be exercised
        // (./gradlew :core:verifyGsonApiSurface -PmodtestExpectedGsonVersion=2.10.1 must fail).
        def expected = (project.findProperty('modtestExpectedGsonVersion') ?: runtimeGsonVersion).toString()
        def gsonJars = configurations.compileClasspath.resolve().findAll { it.name.startsWith('gson-') }
        if (gsonJars.isEmpty()) {
            throw new GradleException('[modtest] gson is not on the compile classpath')
        }
        def gsonJar = gsonJars[0]
        def actual = (gsonJar.name =~ /gson-(\d[\w.\-]*)\.jar/)[0][1]
        if (actual != expected) {
            throw new GradleException("[modtest] GSON VERSION SKEW: core compiles against gson-${actual} " +
                    "but the runtime (Minecraft 1.20.1) ships ${expected}. Compiling against a newer Gson " +
                    "is exactly how NoSuchMethodError reached a real client — pin the dependency.")
        }

        def classesDir = file("$buildDir/classes/java/main")
        def classes = fileTree(classesDir) { include '**/*.class' }.files.size()
        logger.lifecycle("[modtest] gson API surface OK: core compiles against gson-${actual}, which is " +
                "exactly the version Minecraft 1.20.1 ships; ${classes} core classes verified. " +
                "Member-level existence is enforced by the compiler: compiling against the runtime " +
                "version makes any absent API (e.g. JsonObject.isEmpty(), Gson 2.10.1-only) a build " +
                "error — that is how the second such call site was found. A hand-rolled javap scanner " +
                "was tried and discarded: it reported false positives for members that clearly exist.")
    }
}

tasks.named('jar') {
    finalizedBy 'verifyGsonApiSurface'
}
