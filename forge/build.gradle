// forge: the thin Forge 1.20.1 adapter that makes a real client answerable to modtest-bridge/1.0.
//
// This module is the ONLY place that knows about Minecraft, Forge or mixins. All protocol and
// safety logic lives in :core (pure JVM, fully unit-tested); this module just wires it to a client.
//
// It is a development artifact: never bundle it into a product jar (see HarnessEntryCheck / the
// root `verifyProductJar` task) and never run it against a server you do not own.
plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // MixinGradle wires the Mixin annotation processor to ForgeGradle's mapping files, so the refmap
    // is derived mechanically from the annotations: every member reference is remapped by the AP,
    // not enumerated by hand (a hand-written generator previously covered only the injection method
    // name and therefore missed the @At target member).
    id 'org.spongepowered.mixin' version '0.7.+'
}

mixin {
    add sourceSets.main, 'modtest.refmap.json'
    config 'modtest.harness.mixins.json'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    // The mixin annotation processor handles remapping; no access transformers.
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.1.3'
    // :core stays an independent pure-JVM module (its own sources, its own 81 tests, no Minecraft on
    // its classpath). Its *compiled classes* are merged into this jar below.
    //
    // Why not Forge's standard JarJar: JarJar refuses a dependency whose version carries a
    // prerelease qualifier — "The given version specification is invalid: 1.0.0-alpha.1 … convert
    // this to a maven compatible format" (and "1.0.0-alpha-1" fails identically). The version line
    // is a project decision, and faking an embedded version to satisfy the tool would make the
    // artifact lie about itself, so the sanctioned fallback (merge) is used instead.
    implementation project(':core')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Same build flag as :core, so both artifacts identify the same way (see Guard.BuildVariant).
def guardVariant = project.hasProperty('unguarded') ? 'unguarded' : 'guarded'

// ---- shared: entry CRCs of a jar, used to prove a task inspected the FINAL artifact ------------
// task-77. Two different wrong states were mistaken for the shippable jar during the alpha.3 cut,
// so the guardrails now compare what they read against what reobfJar produced, entry by entry.
ext.jarEntryCrcs = { File f ->
    def crcs = [:]
    new java.util.zip.ZipFile(f).withCloseable { zf ->
        zf.entries().each { e -> if (!e.isDirectory()) { crcs[e.name] = e.crc } }
    }
    return crcs
}

// ---- guardrail: fail the build when a mixin member reference would not be remapped -----------
// "0/1 injection points matched" is otherwise only observable when a real client starts (and then
// it is fatal). This task reads the mixin sources, resolves every member reference against the same
// TSRG table reobfJar uses, and requires the packaged refmap to contain the resolved SRG member.
//
// Reference categories it extracts, and the criterion for each:
//   C1  @Inject/@Redirect/@ModifyArg/… `method = "<name>"`  -> refmap must contain the key "<name>"
//   C2  @At(value="INVOKE", target="Lowner;name(desc)ret")  -> refmap must contain the SRG method name
//   C3  @At(value="FIELD",  target="Lowner;name:desc")      -> refmap must contain the SRG field name
//   C4  @Accessor/@Invoker value="…" (bare or full ref)     -> covered by C1/C2 rules
// Any new annotation kind must be added here with its own criterion; the extraction is
// source-driven precisely so that a future annotation cannot pass unnoticed.
tasks.register('verifyMixinRefmap') {
    group = 'verification'
    description = 'Fails the build when a mixin member reference is missing from the packaged refmap'
    dependsOn 'compileJava'
    // task-77: verify the FINAL artifact. `build/libs` is written twice — by `jar` (official/mapped
    // names, no SRG references) and then by `reobfJar`, which replaces it with the shippable bytes.
    // A guardrail-only invocation used to stop after `jar`, leaving build/libs holding the
    // NON-REOBFUSCATED intermediate: measured 159,308 B with ZERO SRG references, versus 160,157 B
    // with 40 m_*/10 f_* references for the real artifact. That jar would not work in a client.
    dependsOn 'reobfJar'
    def tsrgFile = file("$buildDir/createMcpToSrg/output.tsrg")
    def refmapName = 'modtest.refmap.json'
    def mixinConfigName = 'modtest.harness.mixins.json'
    def sources = fileTree('src/main/java') { include '**/*Mixin*.java' }
    inputs.files sources
    inputs.file tsrgFile
    outputs.upToDateWhen { false }

    doLast {
        def lines = tsrgFile.exists() ? tsrgFile.readLines('UTF-8') : []
        def member = { String owner, String name, String desc ->
            int start = lines.findIndexOf { it.startsWith(owner + ' ') && !it.startsWith("\t") }
            if (start < 0) {
                throw new GradleException("[modtest] guardrail: ${owner} is absent from the mapping table")
            }
            for (int i = start + 1; i < lines.size() && lines[i].startsWith("\t"); i++) {
                def f = lines[i].trim().split(/\s+/)
                if (f.length >= 3 && f[0] == name && f[1] == desc) {
                    return f[2]
                }
            }
            throw new GradleException("[modtest] guardrail: ${owner}.${name}${desc} is absent from the mapping table")
        }

        def bareNames = [] as Set
        def fullRefs = [] as Set
        sources.each { File f ->
            def text = f.getText('UTF-8')
            // Bare method names come from `method = "..."` (and accessor `value = "..."` is handled
            // below as a full ref). `@At(value = "INVOKE")` is an enum constant, NOT a member name,
            // so it must never enter the bare-name set.
            (text =~ /(?m)\bmethod\s*=\s*"([^"]+)"/).each { m ->
                def ref = m[1]
                if (ref.startsWith('L') && ref.contains(';')) {
                    fullRefs << ref
                } else if (ref ==~ /[A-Za-z_$][\w$]*/) {
                    bareNames << ref
                }
            }
            // Full member references: @At(target = "Lowner;member…") and accessor/invoker refs.
            (text =~ /(?m)\b(?:target|value)\s*=\s*"(L[^"]*;[^"]*)"/).each { m -> fullRefs << m[1] }
        }

        def expected = [:]   // annotation string -> SRG member name it must resolve to
        fullRefs.each { ref ->
            def semi = ref.indexOf(';')
            String owner = ref.substring(1, semi)
            String rest = ref.substring(semi + 1)
            String name, desc
            if (rest.contains(':')) {
                name = rest.substring(0, rest.indexOf(':'))
                desc = rest.substring(rest.indexOf(':') + 1)
            } else {
                def op = rest.indexOf('(')
                name = rest.substring(0, op)
                // Everything from '(' on is the descriptor plus return type, e.g. "(ZF)V".
                desc = rest.substring(op)
            }
            expected[ref] = member(owner, name, desc)
        }

        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("[modtest] guardrail: jar not built: ${jarFile}")
        }
        // task-77: `build/libs` must hold what reobfJar produced, not the plain `jar` output that
        // reobfuscation has not touched yet. Comparing entry CRCs with reobfJar's own output is the
        // mechanical check — it fails whenever any other task's bytes are sitting in build/libs,
        // which the mixin-product check below does NOT catch (the intermediate has both products).
        // ForgeGradle declares no outputs for reobfJar, so use the path this project actually produces
        // (verified: build/reobfJar/output.jar, content-identical to the shipped build/libs jar).
        def reobfOutput = file("$buildDir/reobfJar/output.jar")
        if (!reobfOutput.exists()) {
            throw new GradleException("[modtest] guardrail FAILED: ${reobfOutput} does not exist — " +
                    "reobfJar never ran, so the jar in build/libs cannot be the shippable artifact.")
        }
        def expectedCrcs = jarEntryCrcs(reobfOutput)
        def actualCrcs = jarEntryCrcs(jarFile)
        def mismatched = (expectedCrcs.keySet() + actualCrcs.keySet()).findAll { expectedCrcs[it] != actualCrcs[it] }
        if (!mismatched.isEmpty()) {
            throw new GradleException("[modtest] guardrail FAILED: ${jarFile} is NOT the reobfuscated " +
                    "artifact — ${mismatched.size()} entrie(s) differ from ${reobfOutput}: " +
                    "${mismatched.take(8)}. A guardrail-only invocation must not leave a " +
                    "non-reobfuscated jar in build/libs.")
        }
        def refmapText = null
        new java.util.zip.ZipFile(jarFile).withCloseable { zf ->
            def entry = zf.getEntry(refmapName)
            if (entry == null) {
                throw new GradleException("[modtest] guardrail: the jar contains no ${refmapName}")
            }
            refmapText = zf.getInputStream(entry).getText('UTF-8')
            // task-77: and it must carry the mixin products. This check alone is NOT sufficient — the
            // measured non-reobfuscated intermediate contains both of them — so the reobfJar identity
            // comparison above is the one that actually holds the line.
            def missingProducts = [refmapName, mixinConfigName].findAll { zf.getEntry(it) == null }
            if (!missingProducts.isEmpty()) {
                throw new GradleException("[modtest] guardrail FAILED: the jar is not the final artifact — " +
                        "it is missing the mixin product(s) ${missingProducts}. Never verify or ship an " +
                        "intermediate jar; build with :forge:build.")
            }
        }

        def problems = []
        expected.each { ref, srg ->
            if (!refmapText.contains(srg)) {
                problems << "C2/C3 ${ref} -> expected SRG member ${srg} in ${refmapName}"
            }
        }
        bareNames.each { name ->
            if (!refmapText.contains("\"${name}\"")) {
                problems << "C1 method=\"${name}\" is absent from ${refmapName}"
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("[modtest] guardrail FAILED:\n  " + problems.join("\n  "))
        }
        logger.lifecycle("[modtest] guardrail OK — C1 bare names ${bareNames} present, " +
                "C2/C3 member refs resolved: ${expected}; final artifact carries " +
                "[${refmapName}, ${mixinConfigName}]")
    }
}

// ---- guardrail: the artifact must carry the :core library -----------------------------------
// The P0c crash was NoClassDefFoundError for a :core class at mod construction time: the jar had
// 15 entries and zero of them were :core. This check asserts the packaged artifact actually
// contains the compiled core classes — either nested (JarJar, META-INF/jarjar/*.jar) or top-level —
// and that the embedded count matches what :core compiled. Fewer than compiled => build fails.
tasks.register('verifySelfContainedJar') {
    group = 'verification'
    description = 'Fails the build when the packaged jar does not carry the :core library'
    dependsOn 'jar'
    // task-77: this task is the one that triggers `jar`, so without reobfJar in its graph it inspects
    // the NON-REOBFUSCATED intermediate (build/libs is written by `jar` first, then replaced by
    // `reobfJar`). Both the dependency and the identity assertion below are needed.
    dependsOn 'reobfJar'
    outputs.upToDateWhen { false }
    doLast {
        def coreClassesDir = project(':core').layout.buildDirectory.dir('classes/java/main').get().asFile
        def coreClasses = coreClassesDir.exists()
                ? fileTree(coreClassesDir) { include 'io/github/minatoai/modtest/core/**/*.class' }.files.size()
                : 0
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("[modtest] self-contained guardrail: no jar at ${jarFile}")
        }
        int topLevelCore = 0
        boolean packMcmeta = false
        def nestedJars = [:]
        def metadata = null
        def mixinProductsPresent = [] as Set
        def requiredMixinProducts = ['modtest.refmap.json', 'modtest.harness.mixins.json']
        new java.util.zip.ZipFile(jarFile).withCloseable { zf ->
            zf.entries().each { e ->
                if (e.name in requiredMixinProducts) {
                    mixinProductsPresent << e.name
                }
                if (e.name.startsWith('io/github/minatoai/modtest/core/') && e.name.endsWith('.class')) {
                    topLevelCore++
                }
                if (e.name.startsWith('META-INF/jarjar/') && e.name.endsWith('.jar')) {
                    def tmp = File.createTempFile('modtest-nested', '.jar')
                    try {
                        zf.getInputStream(e).withStream { ins -> tmp.withOutputStream { os -> os << ins } }
                        new java.util.zip.ZipFile(tmp).withCloseable { nz ->
                            nestedJars[e.name] = nz.entries().findAll {
                                it.name.startsWith('io/github/minatoai/modtest/core/') && it.name.endsWith('.class')
                            }.size()
                        }
                    } finally {
                        tmp.delete()
                    }
                }
                if (e.name == 'META-INF/jarjar/metadata.json') {
                    zf.getInputStream(e).withStream { ins -> metadata = ins.getText('UTF-8') }
                }
                if (e.name == 'pack.mcmeta') {
                    packMcmeta = true
                }
            }
        }
        int nestedCore = nestedJars.values().sum() ?: 0
        // task-77: the artifact read here must be what reobfJar produced. This is the assertion that
        // catches the non-reobfuscated intermediate (measured: 0 SRG references, 159,308 B); the mixin
        // products exist in BOTH states, so checking those alone would have passed the wrong jar.
        def reobfOutput = file("$buildDir/reobfJar/output.jar")
        if (!reobfOutput.exists()) {
            throw new GradleException("[modtest] self-contained guardrail FAILED: ${reobfOutput} does not " +
                    "exist — reobfJar never ran, so the jar in build/libs cannot be the shippable artifact.")
        }
        def expectedCrcs = jarEntryCrcs(reobfOutput)
        def actualCrcs = jarEntryCrcs(jarFile)
        def notReobfuscated = (expectedCrcs.keySet() + actualCrcs.keySet())
                .findAll { expectedCrcs[it] != actualCrcs[it] }
        if (!notReobfuscated.isEmpty()) {
            throw new GradleException("[modtest] self-contained guardrail FAILED: ${jarFile} is NOT the " +
                    "reobfuscated artifact — ${notReobfuscated.size()} entrie(s) differ from ${reobfOutput}: " +
                    "${notReobfuscated.take(8)}. A guardrail-only invocation must not leave a " +
                    "non-reobfuscated jar in build/libs.")
        }
        // task-77: same final-artifact mixin check as verifyMixinRefmap — necessary, not sufficient.
        def missingMixinProducts = requiredMixinProducts.findAll { !mixinProductsPresent.contains(it) }
        if (!missingMixinProducts.isEmpty()) {
            throw new GradleException("[modtest] self-contained guardrail FAILED: the jar is not the final " +
                    "artifact — it is missing the mixin product(s) ${missingMixinProducts}. Build with " +
                    ":forge:build so addMixinsToJar runs.")
        }
        logger.lifecycle("[modtest] self-contained check: :core compiled=${coreClasses} class(es); " +
                "top-level core=${topLevelCore}; nested jars=${nestedJars}; metadata=${metadata}; " +
                "mixin products=${mixinProductsPresent.sort()}")
        if (topLevelCore + nestedCore == 0) {
            throw new GradleException("[modtest] self-contained guardrail FAILED: the jar carries NO " +
                    ":core classes (top-level=0, nested=0). Use jarJar(implementation(project(':core'))) " +
                    "or provide core another way — do not merge core's sources into :forge.")
        }
        if (coreClasses > 0 && topLevelCore + nestedCore < coreClasses) {
            throw new GradleException("[modtest] self-contained guardrail FAILED: only " +
                    "${topLevelCore + nestedCore} of ${coreClasses} compiled :core classes are packaged")
        }
        if (!nestedJars.isEmpty() && (metadata == null || !metadata.contains('modtest-harness-core'))) {
            logger.warn("[modtest] self-contained guardrail: META-INF/jarjar/metadata.json missing or " +
                    "does not name modtest-harness-core (nested jar may not be registered)")
        }
        // P0d: a jar without pack.mcmeta makes Forge log "Missing metadata in pack" and raise a
        // *blocking* "mod loading warnings" screen (client.showLoadWarnings defaults to true), which
        // stalls every automated real-machine run at the main menu.
        if (!packMcmeta) {
            throw new GradleException("[modtest] self-contained guardrail FAILED: the jar has no " +
                    "pack.mcmeta — Forge would raise a blocking mod-loading warning screen. " +
                    "Add forge/src/main/resources/pack.mcmeta.")
        }
        logger.lifecycle("[modtest] self-contained guardrail OK: ${topLevelCore + nestedCore} :core " +
                "class(es) packaged (top-level=${topLevelCore}, nested=${nestedCore})")
    }
}

tasks.named('jar') {
    finalizedBy 'verifyMixinRefmap'
    finalizedBy 'verifySelfContainedJar'
    // Merge :core's compiled classes into this jar (no source merging: :core keeps its own module,
    // its own test suite and a Minecraft-free classpath). reobfJar then reobfuscates everything;
    // :core contains no Minecraft references, so reobf is a no-op for it.
    from(project(':core').sourceSets.main.output)
    // The unguarded variant gets its own classifier so BOTH artifacts can sit on disk at once and
    // can never be confused inside mods/ (each still identifies itself in its manifest).
    if (guardVariant == 'unguarded') {
        archiveClassifier = 'unguarded'
    }
    archiveBaseName = 'modtest-harness-forge'
    manifest {
        attributes(
                'Implementation-Title': 'modtest-mcp Forge adapter (DEV ONLY)',
                'Implementation-Version': project.version,
                'Modtest-Artifact': 'harness',
                'Modtest-Guard-Variant': guardVariant,
                'MixinConfigs': 'modtest.harness.mixins.json',
                'Modtest-Warning': guardVariant == 'guarded'
                        ? 'Development harness. Guarded build. Never bundle into a product jar.'
                        : 'UNGUARDED DEVELOPMENT HARNESS BUILD: the injection policy is disabled. Use only on servers you own. Never redistribute.'
        )
    }
}
