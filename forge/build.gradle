// forge: the thin Forge 1.20.1 adapter that makes a real client answerable to modtest-bridge/1.0.
//
// This module is the ONLY place that knows about Minecraft, Forge or mixins. All protocol and
// safety logic lives in :core (pure JVM, fully unit-tested); this module just wires it to a client.
//
// It is a development artifact: never bundle it into a product jar (see HarnessEntryCheck / the
// root `verifyProductJar` task) and never run it against a server you do not own.
plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    // The adapter needs the mixin annotation processor only; no access transformers.
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.1.3'
    implementation project(':core')
}

// Same build flag as :core, so both artifacts identify the same way (see Guard.BuildVariant).
def guardVariant = project.hasProperty('unguarded') ? 'unguarded' : 'guarded'

// ---- mixin refmap (production / SRG domain) -----------------------------------------------
// Without a refmap, Mixin resolves the annotation's *named* string ("aiStep") against the
// *SRG-domain* runtime class, finds nothing, and kills the game at startup:
//   "Reference map 'modtest.refmap.json' … could not be read … No refMap loaded"
// No Mixin annotation processor is wired under ForgeGradle 6, so the map is written from the very
// TSRG table `reobfJar` uses; the refmap therefore cannot disagree with the reobfuscated bytecode.
def mixinConfig = 'modtest.harness.mixins.json'
def refmapFileName = 'modtest.refmap.json'
// mixin class (slash path, as mixins.json package+name resolves) -> owner -> officialMember -> desc
def mixinTargets = [
        'io/github/minatoai/modtest/forge/mixin/InputInjectionMixin': [
                'net/minecraft/client/player/LocalPlayer': ['aiStep': '()V']
        ]
]

tasks.register('generateRefmap') {
    group = 'build'
    description = 'Writes the Mixin refmap (named -> SRG) for the production domain'
    dependsOn 'createMcpToSrg'
    def tsrg = file("$buildDir/createMcpToSrg/output.tsrg")
    def out = file("$buildDir/generated/refmap/${refmapFileName}")
    inputs.file tsrg
    outputs.file out
    doLast {
        def lines = tsrg.readLines('UTF-8')
        // TSRG v1: a class header is "<owner> <srgOwner>"; its members are tab-indented
        // "<officialName> <desc> <srgName>" lines.
        def lookup = { String owner, String member, String desc ->
            int start = lines.findIndexOf { it.startsWith(owner + ' ') && !it.startsWith("\t") }
            if (start < 0) {
                throw new GradleException("[modtest] TSRG has no class ${owner}")
            }
            for (int i = start + 1; i < lines.size() && lines[i].startsWith("\t"); i++) {
                def f = lines[i].trim().split(/\s+/)
                if (f.length >= 3 && f[0] == member && f[1] == desc) {
                    return f[2]
                }
            }
            throw new GradleException("[modtest] TSRG has no member ${owner}.${member}${desc}")
        }
        def mappings = [:]
        mixinTargets.each { mixinClass, owners ->
            def per = [:]
            owners.each { owner, members ->
                members.each { member, desc ->
                    def srg = lookup(owner, member, desc)
                    per[member] = "L${owner};${srg}${desc}"
                    logger.lifecycle("[modtest] refmap ${mixinClass}.${member} -> L${owner};${srg}${desc}")
                }
            }
            mappings[mixinClass] = per
            // Mixin also accepts the dotted class name; an extra key is ignored unless it is looked up.
            mappings[mixinClass.replace('/', '.')] = per
        }
        out.parentFile.mkdirs()
        out.text = '{\n  "mappings": ' + groovy.json.JsonOutput.toJson(mappings) + ',\n  "data": {}\n}\n'
        logger.lifecycle("[modtest] refmap written: ${out}")
    }
}

jar {
    dependsOn 'generateRefmap'
    from("$buildDir/generated/refmap") {
        include refmapFileName
    }
    archiveBaseName = 'modtest-harness-forge'
    manifest {
        attributes(
                'Implementation-Title': 'modtest-mcp Forge adapter (DEV ONLY)',
                'Implementation-Version': project.version,
                'Modtest-Artifact': 'harness',
                'Modtest-Guard-Variant': guardVariant,
                'MixinConfigs': 'modtest.harness.mixins.json',
                'Modtest-Warning': guardVariant == 'guarded'
                        ? 'Development harness. Guarded build. Never bundle into a product jar.'
                        : 'UNGUARDED DEVELOPMENT HARNESS BUILD: the injection policy is disabled. Use only on servers you own. Never redistribute.'
        )
    }
}
