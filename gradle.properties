group=io.github.minatoai
# Same version line as the Python package (1.0.0a4 = PEP 440 for 1.0.0-alpha.4), in Gradle's notation.
# NOTE: Forge's JarJar cannot embed this project as a nested jar because its version parser rejects
# prerelease qualifiers ("1.0.0-alpha.4" and "1.0.0-alpha-4" are both invalid there), so :forge
# merges :core's *compiled classes* into its own jar instead — see forge/build.gradle.
version=1.0.0-alpha.4

org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.vfs.watch=false
