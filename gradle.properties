group=io.github.minatoai
# Same version line as the Python package (1.0.0a1), in Gradle's own notation.
# NOTE: Forge's JarJar cannot embed this project as a nested jar because its version parser rejects
# prerelease qualifiers ("1.0.0-alpha.1" and "1.0.0-alpha-1" are both invalid there), so :forge
# merges :core's *compiled classes* into its own jar instead — see forge/build.gradle.
version=1.0.0-alpha.1

org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.vfs.watch=false
