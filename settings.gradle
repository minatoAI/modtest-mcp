// Must be the first statement in a settings script.
// ForgeGradle is published to the Forge maven; the Gradle Plugin Portal mirrors it only sometimes.
// Declaring the repository is build configuration, not proxy/credential persistence.
pluginManagement {
    repositories {
        maven { url = uri('https://maven.minecraftforge.net/') }
        gradlePluginPortal()
    }
}

rootProject.name = 'modtest-mcp'

// Stage 2: the Java side of the harness.
//  core  - protocol relay (M1), input-injection guard (M2) and ticket executor (M3), pure JVM:
//          no Minecraft and no Forge on the classpath, so every rule is unit-testable.
//  forge - the thin Forge 1.20.1 adapter (mixins + ClientModel implementation) that makes a real
//          client answerable to the protocol. It is a *consumer* of core, never the other way round.
include 'core'
// The Forge adapter needs the ForgeGradle toolchain (plugin + Minecraft artifacts), so it is opt-in:
//   ./gradlew :forge:compileJava -PwithForge
// That keeps the protocol core buildable with an empty dependency cache and with no network.
if (file('forge/build.gradle').exists() && gradle.startParameter.projectProperties.containsKey('withForge')) {
    include 'forge'
}
